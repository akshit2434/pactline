<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="visuals.css">
<style>
:root{--w:1500px;--h:1000px}
h1{font-size:56px;margin-top:18px}
.row{display:flex;gap:28px;margin-top:44px;align-items:stretch}
.t{border-radius:24px;padding:32px;display:flex;align-items:center;justify-content:center}
.sizes{display:flex;gap:28px;align-items:flex-end;padding:32px 36px}
.sizes figure{display:flex;flex-direction:column;align-items:center;gap:10px;font:600 14px/1 var(--font);color:var(--ink-3)}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:28px}
.s{border-radius:18px;height:150px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;font:700 17px/1.3 var(--font)}
.s span{font:500 14px/1.2 var(--mono);opacity:.85}
.type{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;margin-top:28px}
.type .card{padding:26px 30px}
.big{font:800 54px/1 var(--font);letter-spacing:-.028em}
.mono-big{font:500 30px/1.2 var(--mono);color:var(--navy)}
.cap{font:600 14px/1 var(--font);color:var(--ink-3);margin-top:12px}
</style></head><body>
<div class="frame" style="padding-top:60px">
  <div class="eyebrow">Brand</div>
  <h1>A line that holds, then releases.</h1>
  <div class="row">
    <div class="t card" style="width:470px"><img src="../../assets/logo-wordmark.svg" style="height:78px"></div>
    <div class="t" style="width:470px;background:#0A1224"><img src="../../assets/logo-wordmark-dark.svg" style="height:78px"></div>
    <div class="card sizes"><figure><img src="../../assets/logo-symbol.svg" width="96">96</figure><figure><img src="../../assets/logo-symbol.svg" width="48">48</figure><figure><img src="../../assets/favicon.svg" width="32">32</figure><figure><img src="../../assets/favicon.svg" width="16">16</figure></div>
  </div>
  <div class="sw">
    <div class="s" style="background:#003087;color:#fff">Pact Navy<span>#003087</span></div>
    <div class="s" style="background:#0070E0;color:#fff">Hold Blue<span>#0070E0</span></div>
    <div class="s" style="background:#C8F031;color:#0B1B3A">Clearance Lime<span>#C8F031</span></div>
    <div class="s" style="background:#0B1B3A;color:#fff">Ink<span>#0B1B3A</span></div>
    <div class="s" style="background:#0A1224;color:#fff">Night<span>#0A1224</span></div>
    <div class="s" style="background:#F3F6FA;color:#0B1B3A;border:1px solid #E1E7EF">Paper<span>#F3F6FA</span></div>
  </div>
  <div class="type">
    <div class="card"><div class="big">Inter, tight · $1,200.00</div><div class="cap">Inter 800 headings (−0.028em), 500 body · SIL OFL</div></div>
    <div class="card"><div class="mono-big">AUTH-7XK2… 201</div><div class="cap">JetBrains Mono for IDs, ledger, code · SIL OFL</div></div>
  </div>
</div></body></html>
