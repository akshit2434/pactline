<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="t d">
<title id="t">Pactline</title><desc id="d">A line runs from the client, ties a loop where PayPal holds the money, and ends in a lime dot when proof clears and the freelancer is paid.</desc>
<style>
.l{fill:none;stroke:#0070E0;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s cubic-bezier(.2,.8,.2,1) .2s forwards}
.d{fill:#C8F031;stroke:#003087;stroke-width:4;transform-origin:1112px 150px;transform:scale(0);animation:pop .5s cubic-bezier(.34,1.56,.64,1) 2.5s forwards}
.t{font:700 22px Inter,"Helvetica Neue",Arial,sans-serif;fill:#5B6B82;opacity:0;animation:fade .5s ease-out forwards}
.t b,.b{fill:#0070E0}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{transform:scale(1)}}@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.l,.d,.t{animation:none;stroke-dashoffset:0;transform:none;opacity:1}}
</style>
<path class="l" pathLength="1" d="M20 150H520C590 150 625 100 625 70C625 44 607 28 586 28C565 28 547 44 547 70C547 100 582 150 652 150H1080"/>
<circle class="d" cx="1112" cy="150" r="18"/>
<text class="t b" x="20" y="200" style="animation-delay:.3s">Client</text>
<text class="t" x="490" y="200" style="animation-delay:1.1s"><tspan class="b">$1,200</tspan> held by PayPal</text>
<text class="t" x="790" y="200" style="animation-delay:1.9s">proof clears</text>
<text class="t b" x="1180" y="200" text-anchor="end" style="animation-delay:2.7s">Freelancer paid</text>
</svg>
