<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pactline · Deals that pay themselves</title>
  <meta name="description" content="Describe a deal in plain English. PayPal holds the money, proof releases it.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('pl-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div id="demo-progress" class="demo-progress" hidden><i></i></div>

  <header class="top" id="top">
    <a class="brand" href="#/" aria-label="Pactline home">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 64 64" width="30" height="30"><defs><clipPath id="plmark"><rect width="64" height="64" rx="17"/></clipPath></defs><rect width="64" height="64" rx="17" fill="#003087"/><g clip-path="url(#plmark)"><g transform="translate(0 -2)"><path d="M-4 46H20C33 46 40 34 40 27C40 21 36.4 17 32 17C27.6 17 24 21 24 27C24 34 30 46 40 46H42" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="53.4" cy="46" r="5" fill="#C8F031"/></g></g></svg></span>
      <span class="brand-name">Pactline</span>
    </a>
    <nav class="steps" id="steps" aria-label="Progress"></nav>
    <div class="top-right">
      <span class="pill status" id="status-pill"><i class="dot"></i><span>…</span></span>
      <a class="btn ghost sm" id="ledger-link" href="#/ledger" hidden>Ledger</a>
      <button class="btn ghost sm demo-btn" id="demo-btn" type="button" aria-pressed="false" title="Auto-play the happy path (D)"></button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark theme"></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="site-foot" id="site-foot">
    <span class="held-by">Payments held by <img class="pp-logo-img" src="assets/paypal/paypal-color.svg" alt="PayPal" width="85" height="24"></span>
    <span class="fine">Sandbox demo. Pactline is an independent project, not affiliated with or endorsed by PayPal.</span>
  </footer>

  <div id="sheet-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>

  <div id="caption" class="caption" hidden aria-live="polite"><span></span></div>
  <div id="demo-ctl" class="demo-ctl" hidden>
    <button type="button" class="btn ghost sm" id="demo-pause">Pause</button>
    <button type="button" class="btn ghost sm" id="demo-stop">Exit demo <kbd>Esc</kbd></button>
  </div>
  <div id="ghost" class="ghost-cursor" hidden aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M5 3l14 7-6 2-2 6z" fill="#0B1B3A" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
